<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#05070d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#05070d" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="#05070d"/>
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>

  <!-- Inner glowing brand plate -->
  <rect x="96" y="96" width="320" height="320" rx="72" fill="#0a0d18" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Music Soundwave / Audio MIR Glyphs -->
  <g filter="url(#shadow)">
    <!-- Wave 1 -->
    <path d="M148 256 C148 240, 160 228, 176 228 C192 228, 204 240, 204 256 C204 272, 216 284, 232 284 C248 284, 260 272, 260 256 C260 240, 272 228, 288 228 C304 228, 316 240, 316 256 C316 272, 328 284, 344 284 C360 284, 372 272, 372 256"
          fill="none" stroke="url(#waveGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Wave 2 (Echo) -->
    <path d="M148 256 C148 210, 165 190, 190 190 C215 190, 230 215, 256 215 C282 215, 297 190, 322 190 C347 190, 364 210, 372 256 C372 302, 355 322, 330 322 C305 322, 290 297, 264 297 C238 297, 223 322, 198 322 C173 322, 156 302, 148 256 Z"
          fill="none" stroke="url(#waveGrad)" stroke-width="8" stroke-opacity="0.4" stroke-linecap="round"/>

    <!-- Equalizer Harmonic Beams -->
    <rect x="180" y="160" width="16" height="192" rx="8" fill="url(#waveGrad)"/>
    <rect x="220" y="130" width="16" height="252" rx="8" fill="url(#waveGrad)"/>
    <rect x="260" y="170" width="16" height="172" rx="8" fill="url(#waveGrad)"/>
    <rect x="300" y="140" width="16" height="232" rx="8" fill="url(#waveGrad)"/>
    <rect x="340" y="190" width="16" height="132" rx="8" fill="url(#waveGrad)"/>
  </g>

  <!-- Lettermark Z badge -->
  <text x="256" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="6">ZARAH</text>
</svg>
