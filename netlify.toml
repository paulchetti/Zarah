# Netlify configuration for Zarah Frontend
[build]
  base = "frontend"
  publish = ".next"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_PUBLIC_API_URL = "https://zarah-backend.onrender.com"

[[plugins]]
  package = "@netlify/plugin-nextjs"
